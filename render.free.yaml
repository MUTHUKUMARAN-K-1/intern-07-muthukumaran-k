# Render Blueprint for a FREE deployment of PillSync. A demo, not for real patients.
#
# What is left out compared with render.yaml, and why:
#   * No Celery worker. A free Render Key Value instance provides shared rate limits. An external
#     free cron service calls POST /internal/run-jobs/ to send reminders instead. See
#     docs/deployment.md, "Option 2b".
#   * No database here. Render's free Postgres has expired after 30 days, so use a free
#     Postgres that does not (Neon, Supabase) and paste its connection string as DATABASE_URL.
#   * No disk, so uploaded prescription photos are lost on each deploy. OCR still works.
#
# Free-tier limits are Render's to change; confirm them on its pricing page.
# The names and region match the no-card setup documented in docs/deployment.md.

services:
  # Cache only: scheduled jobs run in the API and durable job history stays in Postgres.
  # A restart clears the free cache, including rate-limit counters.
  - type: keyvalue
    name: pillsync-cache
    region: singapore
    plan: free
    maxmemoryPolicy: allkeys-lru
    ipAllowList: []

  - type: web
    name: pillsync-mk-api
    region: singapore
    runtime: docker
    branch: intern/07-muthukumaran-k
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health/ready/
    autoDeploy: true
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: RUN_MIGRATIONS
        value: "true"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false              # you are asked for it when the blueprint is applied
      - key: CACHE_URL
        fromService: { type: keyvalue, name: pillsync-cache, property: connectionString }
      - key: FRONTEND_BASE_URL
        value: https://pillsync-mk-web.onrender.com
      - key: CRON_SECRET
        generateValue: true      # copy it from this service's Environment tab into the cron jobs
      - key: ALLOWED_HOSTS
        value: pillsync-mk-api.onrender.com   # change if you rename the service
      - key: CORS_ALLOWED_ORIGINS
        value: https://pillsync-mk-web.onrender.com
      - key: WEB_CONCURRENCY
        value: "1"               # free instances have about 512 MB of memory; Tesseract needs room
      - key: DEFAULT_FROM_EMAIL
        value: noreply@pillsync.example.com
      - key: OCR_ASYNC
        value: "false"
      - key: OCR_MAX_IMAGE_PIXELS
        value: "10000000"       # bound decoded image memory on the 512 MB free API

  # The web app: a static site, free on Render. /api and /admin are forwarded to the API so the
  # browser sees a single origin.
  - type: web
    name: pillsync-mk-web
    runtime: static
    branch: intern/07-muthukumaran-k
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_BASE_URL
        value: /api/v1
    routes:
      - type: rewrite
        source: /health/*
        destination: https://pillsync-mk-api.onrender.com/health/*
      - type: rewrite
        source: /static/*
        destination: https://pillsync-mk-api.onrender.com/static/*
      - type: rewrite
        source: /api/*
        destination: https://pillsync-mk-api.onrender.com/api/*
      - type: rewrite
        source: /media/*
        destination: https://pillsync-mk-api.onrender.com/media/*
      - type: rewrite
        source: /admin/analytics
        destination: /index.html
      - type: rewrite
        source: /admin/users
        destination: /index.html
      - type: rewrite
        source: /admin/*
        destination: https://pillsync-mk-api.onrender.com/admin/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /firebase-messaging-sw.js
        name: Cache-Control
        value: no-cache
      - path: /assets/*
        name: Cache-Control
        value: public, max-age=31536000, immutable
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
