# Preserve HTTPS from the TLS terminator instead of overwriting it with nginx's
# internal http hop. Only expose nginx behind a trusted TLS proxy in production.
map $http_x_forwarded_proto $forwarded_scheme {
    default $scheme;
    https https;
}

map $uri $asset_cache_control {
    default "no-cache";
    ~^/assets/ "public, max-age=31536000, immutable";
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Prescription photos are uploaded through here. nginx's default of 1 MB
    # would reject every phone photo before the API ever saw it; the API applies
    # the real limit (MAX_UPLOAD_SIZE_BYTES) and reports it in plain words.
    client_max_body_size 12m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    add_header Cache-Control $asset_cache_control always;

    # Fingerprinted build assets never change under the same name.
    location /assets/ {
        try_files $uri =404;
    }

    # SPA routing: unknown paths fall back to index.html. index.html itself must
    # not be cached, or a deploy would not reach users until the cache expired.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # OCR on a large photo can take a while on a small machine.
        proxy_read_timeout 120s;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    }

    # The Django admin and its static files, and the health probes.
    location ~ ^/(admin|static|health)/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_scheme;
    }
}
